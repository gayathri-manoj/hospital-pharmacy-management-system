{% extends 'base.html' %}
{% block content %}
<h3>Generate Bill</h3>
<form method="POST" class="mt-3">
  <div class="mb-3">
    <label>Customer Name</label>
    <input type="text" name="customer_name" class="form-control" required>
  </div>

  <div id="medicine-list">
    <div class="medicine-row mb-2">
      <select name="medicine_id[]" class="form-control" required>
        <option value="">-- Select Medicine --</option>
        {% for med in medicines %}
        <option value="{{ med.id }}">{{ med.name }} (₹{{ med.price }} | Stock: {{ med.quantity }})</option>
        {% endfor %}
      </select>
      <input type="number" name="quantity[]" class="form-control mt-1" min="1" required>
    </div>
  </div>

  <button type="button" class="btn btn-secondary mt-2" onclick="addMedicineRow()">Add Another Medicine</button>
  <button type="submit" class="btn btn-primary mt-2">Generate Bill</button>
</form>

<script>
function addMedicineRow() {
    let container = document.getElementById('medicine-list');
    let newRow = document.createElement('div');
    newRow.className = 'medicine-row mb-2';
    newRow.innerHTML = `
        <select name="medicine_id[]" class="form-control" required>
            <option value="">-- Select Medicine --</option>
            {% for med in medicines %}
            <option value="{{ med.id }}">{{ med.name }} (₹{{ med.price }} | Stock: {{ med.quantity }})</option>
            {% endfor %}
        </select>
        <input type="number" name="quantity[]" class="form-control mt-1" min="1" required>
    `;
    container.appendChild(newRow);
}
</script>
{% endblock %}
